<section class="gallery">
  <div class="gallery-head">
    <div>
      <h2>Our Work gallery</h2>
      <p>Photos shown in the “Our Work” section of the website.</p>
    </div>
    <label class="btn btn-accent upload-btn" [class.disabled]="busy()">
      <app-icon name="plus" [size]="16" />
      {{ busy() ? 'Uploading…' : 'Add photos' }}
      <input type="file" accept="image/jpeg,image/png,image/webp" multiple [disabled]="busy()" (change)="onFiles($event)" />
    </label>
  </div>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <div class="grid">
    @for (item of items(); track item.id; let i = $index; let last = $last) {
      <div class="card">
        <img [src]="photo(item)" [alt]="item.title" />
        <div class="body">
          <input #t type="text" placeholder="Name (e.g. Teak sofa set)" [value]="item.title" maxlength="80" />
          <textarea #c rows="2" placeholder="Short caption" [value]="item.caption" maxlength="240"></textarea>
          <div class="actions">
            <button type="button" class="btn btn-secondary btn-sm" (click)="save(item, t.value, c.value)">Save</button>
            <button type="button" class="btn btn-ghost btn-sm" [disabled]="i === 0" (click)="move(i, -1)" aria-label="Move earlier">↑</button>
            <button type="button" class="btn btn-ghost btn-sm" [disabled]="last" (click)="move(i, 1)" aria-label="Move later">↓</button>
            <button type="button" class="btn btn-ghost btn-sm danger" (click)="remove(item)" aria-label="Delete">
              <app-icon name="trash" [size]="16" />
            </button>
          </div>
        </div>
      </div>
    } @empty {
      <p class="empty">No photos yet. Tap “Add photos” to upload your first one.</p>
    }
  </div>
</section>
