<div
  class="modal-backdrop"
  role="presentation"
  tabindex="-1"
  (click)="onBackdropClick($event)"
  (keydown.escape)="onClose()"
>
  <div class="modal">
    <div class="modal-head">
      <h2>Customer Enquiry</h2>
      <button type="button" class="icon-btn" (click)="onClose()" aria-label="Close">
        <app-icon name="close" [size]="18" />
      </button>
    </div>

    @if (submitted()) {
      <div class="message-banner success">
        <app-icon name="check-circle" [size]="18" />
        Customer interest saved.
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="field" [class.invalid]="f.customerName.invalid && f.customerName.touched">
        <label for="customerName">Customer name *</label>
        <input
          id="customerName"
          type="text"
          formControlName="customerName"
          placeholder="Ramesh"
        />
        @if (f.customerName.invalid && f.customerName.touched) {
          <span class="error">Customer name is required.</span>
        }
      </div>

      <div class="field" [class.invalid]="f.phone.invalid && f.phone.touched">
        <label for="phone">Phone number *</label>
        <input id="phone" type="tel" formControlName="phone" placeholder="9876543210" />
        @if (f.phone.invalid && f.phone.touched) {
          <span class="error">Phone number is required.</span>
        }
      </div>

      <div class="field" [class.invalid]="f.productId.invalid && f.productId.touched">
        <label for="productId">Product *</label>
        <select id="productId" formControlName="productId">
          <option value="" disabled>Select a product</option>
          @for (product of products(); track product.id) {
            <option [value]="product.id">{{ product.name }}</option>
          }
        </select>
        @if (f.productId.invalid && f.productId.touched) {
          <span class="error">Please select a product.</span>
        }
      </div>

      <div class="field">
        <label for="notes">Notes</label>
        <textarea
          id="notes"
          rows="3"
          formControlName="notes"
          placeholder="Interested in delivery next week"
        ></textarea>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" (click)="onClose()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Enquiry</button>
      </div>
    </form>
  </div>
</div>
